name: Build SomaOS Image

on:
  push:
    branches: [main]
  workflow_dispatch:  # manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240  # 4 hour max

    steps:
      - uses: actions/checkout@v4

      # Cache the rust:latest Docker image layers between runs
      - name: Cache Docker images
        uses: actions/cache@v4
        with:
          path: /tmp/docker-cache
          key: docker-rust-${{ hashFiles('buildroot/build.sh') }}
          restore-keys: docker-rust-

      - name: Load cached Docker images
        run: |
          if [ -f /tmp/docker-cache/rust.tar ]; then
            docker load < /tmp/docker-cache/rust.tar
          fi

      # Step 1: Cross-compile Rust binaries (native x86, no Rosetta)
      - name: Compile Rust binaries
        run: cd buildroot && ./build.sh --rust-only
        env:
          SOMA_BUILD_JOBS: 4

      # Save rust:latest to cache after first pull
      - name: Save Docker image cache
        run: |
          mkdir -p /tmp/docker-cache
          docker save rust:latest -o /tmp/docker-cache/rust.tar 2>/dev/null || true

      # Step 2: Build OS image via Buildroot (4 parallel jobs)
      - name: Build OS image
        run: cd buildroot && SOMA_BUILD_JOBS=4 ./build.sh --image-only
        env:
          SOMA_BUILD_JOBS: 4

      # Compress — raw ext4 compresses well (~60-70% reduction)
      - name: Compress image
        run: |
          cd buildroot/output
          gzip -6 soma-os.img
          ls -lh

      # Upload as downloadable artifact (available for 14 days)
      - name: Upload soma-os image
        uses: actions/upload-artifact@v4
        with:
          name: soma-os-x86_64-${{ github.sha }}
          path: |
            buildroot/output/soma-os.img.gz
            buildroot/output/bzImage
          retention-days: 14

      # On tagged releases, also attach to GitHub Release
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          gh release upload ${{ github.ref_name }} \
            buildroot/output/soma-os.img.gz \
            buildroot/output/bzImage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
