name: Build SomaOS Image

on:
  push:
    branches: [main]
  workflow_dispatch:  # manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240  # 4 hour max
    strategy:
      matrix:
        arch: [x86_64, aarch64]
      fail-fast: false  # build both even if one fails

    steps:
      - uses: actions/checkout@v4

      # Free up ~20 GB by removing pre-installed tools we don't need
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/share/swift
          sudo apt-get clean
          docker system prune -af
          df -h

      # Cache the rust:latest Docker image layers between runs
      - name: Cache Docker images
        uses: actions/cache@v4
        with:
          path: /tmp/docker-cache
          key: docker-rust-${{ matrix.arch }}-${{ hashFiles('buildroot/build.sh') }}
          restore-keys: docker-rust-${{ matrix.arch }}-

      - name: Load cached Docker images
        run: |
          if [ -f /tmp/docker-cache/rust.tar ]; then
            docker load < /tmp/docker-cache/rust.tar
          fi

      # Step 1: Cross-compile Rust binaries
      - name: Compile Rust binaries
        run: cd buildroot && ./build.sh --rust-only --arch=${{ matrix.arch }}
        env:
          SOMA_BUILD_JOBS: 4

      # Save rust:latest to cache after first pull
      - name: Save Docker image cache
        run: |
          mkdir -p /tmp/docker-cache
          docker save rust:latest -o /tmp/docker-cache/rust.tar 2>/dev/null || true

      # Step 2: Build OS image via Buildroot (4 parallel jobs)
      - name: Build OS image
        run: cd buildroot && ./build.sh --image-only --arch=${{ matrix.arch }}
        env:
          SOMA_BUILD_JOBS: 4

      # Compress — use gzip -c to handle symlinks safely
      - name: Compress image
        run: |
          ls -lh buildroot/output/${{ matrix.arch }}/
          gzip -c buildroot/output/${{ matrix.arch }}/soma-os.img > buildroot/output/${{ matrix.arch }}/soma-os.img.gz
          ls -lh buildroot/output/${{ matrix.arch }}/soma-os.img.gz

      # Upload as downloadable artifact (available for 14 days)
      - name: Upload soma-os image
        uses: actions/upload-artifact@v4
        with:
          name: soma-os-${{ matrix.arch }}-${{ github.sha }}
          path: |
            buildroot/output/${{ matrix.arch }}/soma-os.img.gz
            buildroot/output/${{ matrix.arch }}/kernel
          retention-days: 14

      # On tagged releases, also attach to GitHub Release
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          gh release upload ${{ github.ref_name }} \
            buildroot/output/${{ matrix.arch }}/soma-os.img.gz \
            buildroot/output/${{ matrix.arch }}/kernel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
