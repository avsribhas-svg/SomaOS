image boot.vfat {
    vfat {
        file grub.img {
            image = "grub.img"
        }
    }
    size = 4M
}

image disk.img {
    hdimage {
        partition-table-type = "msdos"
    }

    partition boot {
        partition-type = 0x0c
        bootable = true
        image = "boot.vfat"
        size = 4M
    }

    partition rootfs {
        partition-type = 0x83
        image = "rootfs.ext2"
    }
}
