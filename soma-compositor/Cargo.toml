[package]
name = "soma-compositor"
version = "0.1.0"
edition = "2021"
description = "SomaOS Compositor — Smithay-based Wayland compositor with agent sidebar"

[dependencies]
soma-common = { path = "../soma-common" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

# Graphics & windowing (dev mode)
winit = { version = "0.30", features = ["wayland", "x11"] }
softbuffer = "0.4"
tiny-skia = "0.11"

# Text rendering
cosmic-text = "0.12"

# Logging
log = "0.4"
env_logger = "0.11"

# Misc
uuid = { version = "1", features = ["v4"] }

# PTY support
nix = { version = "0.29", features = ["term", "process", "poll", "fs", "signal"] }
libc = "0.2"

# Image previews
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
base64 = "0.22"
