[package]
name = "soma-agent"
version = "0.1.0"
edition = "2021"
description = "SomaOS Agent Daemon — intent parsing and command execution"

[dependencies]
soma-common = { path = "../soma-common" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
uuid = { version = "1", features = ["v4"] }
log = "0.4"
env_logger = "0.11"
