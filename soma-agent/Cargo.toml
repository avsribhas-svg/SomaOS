[package]
name = "soma-agent"
version = "0.1.0"
edition = "2021"
description = "SomaOS Agent Daemon — intent parsing and command execution"

[dependencies]
soma-common = { path = "../soma-common" }
soma-substrate = { path = "../soma-substrate" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
uuid = { version = "1", features = ["v4"] }
log = "0.4"
env_logger = "0.11"
base64 = "0.22"
scraper = { version = "0.20", default-features = false }
toml = "0.8"
async-trait = "0.1"
rusqlite = { version = "0.31", features = ["bundled"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
sha2 = "0.10"
wasmtime = { version = "21", default-features = false, features = ["cranelift", "component-model", "runtime"] }

[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = "0.3"
nix = { version = "0.29", features = ["process", "signal"] }
libc = "0.2"
